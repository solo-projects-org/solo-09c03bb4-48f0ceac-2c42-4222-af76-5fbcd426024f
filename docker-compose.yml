services:
  delta-recovery:
    build: .
    image: delta-recovery-analyzer:latest
    container_name: delta-recovery-analyzer
    ports:
      - "8000:8000"
    environment:
      # 内置样例目录（容器内路径）；可通过挂载覆盖
      SAMPLE_ROOT: /srv/samples
      # 限制 glibc 每个线程的 malloc arena 数量，避免 PyArrow/解析线程把
      # 256 MiB 内存限额消耗在多 arena 碎片上
      MALLOC_ARENA_MAX: "2"
    volumes:
      # 把宿主任意 Delta 表目录挂进来，便于用样例之外的真实留存材料验证
      - ./samples:/srv/samples:ro
    # 容器硬限 256 MiB（含 swap 也不额外放宽）；大提交按行流式解析、
    # 上传体假脱机到磁盘，单 worker + 线程即可在此限额内完成核查
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 256m
    # 上传体假脱机到 tmpfs（计入 256m 限额而非容器可写层），
    # 给约 192 MiB 的逐行提交留足临时空间
    tmpfs:
      - /tmp:size=192m
    restart: unless-stopped
